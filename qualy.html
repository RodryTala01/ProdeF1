<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Prode Tafa - Qualy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="qualy.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>

<body>

<div id="captura">

<header class="header">

<div class="logo">
<img src="image/f1.png" class="f1">
</div>

<h1>Clasificación</h1>


<div class="logo">
<img src="image/prode-tafa.png">
</div>


</header>

<div class="circuito-info">
<img class="circuito-img">
<div class="fila-circuito">

<span id="circuito-nombre"></span>

</div>

<div class="fila-horario">
<span id="horarioS"></span>
</div>
<div class="fila-horario">
<span id="horario"></span>
</div>

</div>

<h2 class="titulo-pilotos">Pilotos</h2>

<div id="listaPilotos" class="grid-pilotos"></div>

<div class="contenedor">

<div class="columna">

<h2>Q3 (Top 10)</h2>
<div id="q3" class="zona-grid q3-grid"></div>

</div>

<div class="columna">

<div id="q2" class="zona-grid"></div>

</div>

</div>

</div>

<div class="botones-acciones">

<button id="descargar">⬇ Descargar imagen ⬇</button>

<button id="enviar">📤 Enviar pronóstico 📤</button>

<a href="carrera.html">
<button id="carrera">🏁 Ir a carrera 🏁</button>
</a>

</div>

<div class="botones-acciones">
<button id="calculadora">Calcular puntos</button>
</div>

<div id="modalPilotos" class="modal">

<div class="modal-contenido">

<h3>Elegir piloto</h3>

<div id="listaModalPilotos"></div>

<button id="cerrarModal">Cancelar</button>

</div>

</div>

<div id="modalCalculadora" class="modal">

<div class="modal-contenido modal-confirmacion">

<h3>¿Ir a la calculadora?</h3>

<p>Los cambios actuales no se guardarán.</p>

<div class="modal-botones">

<button id="cancelarCalculadora">Cancelar</button>

<button id="confirmarCalculadora">Si</button>

</div>

</div>

</div>

<script src="qualy.js"></script>
