<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora F1</title>

<link rel="stylesheet" href="calculadora.css">
</head>

<body>

<div class="container">

<h1>Calculadora F1</h1>

<label>Mensaje:</label>
<textarea id="mensaje" placeholder="Pega el pronóstico acá"></textarea>

<div class="selectores">

<div>
<label>Gran Premio:</label>
<select id="gp">
<option value="">Seleccionar GP</option>
<option value="australia">Australia</option>
<option value="china">China</option>
<option value="japon">Japón</option>
<option value="bahrein">Bahrein</option>
<option value="arabia">Arabia Saudita</option>
<option value="miami">Miami</option>
<option value="canada">Canadá</option>
<option value="monaco">Mónaco</option>
<option value="espana">España</option>
<option value="austria">Austria</option>
<option value="uk">Reino Unido</option>
<option value="belgica">Bélgica</option>
<option value="hungria">Hungría</option>
<option value="paisesbajos">Países Bajos</option>
<option value="italia">Italia</option>
<option value="madrid">Madrid</option>
<option value="azerbaiyan">Azerbaiyán</option>
<option value="singapur">Singapur</option>
<option value="usa">Estados Unidos</option>
<option value="mexico">México</option>
<option value="brasil">Brasil</option>
<option value="lasvegas">Las Vegas</option>
<option value="qatar">Qatar</option>
<option value="abudabi">Abu Dabi</option>
</select>
</div>

<div id="sprintContainer">
<label>Tipo:</label>
<select id="sprint">
<option value="normal">Normal</option>
<option value="sprint">Sprint</option>
</select>
</div>

</div>

<button id="calcular">Calcular puntos</button>

<div class="resultados">

<div class="tabla-usuario">
<h3>Tu pronóstico</h3>
<div id="tablaUsuario" class="tabla-scroll"></div>
</div>

<div class="tabla-real">
<h3>Resultado oficial</h3>
<div id="tablaReal" class="tabla-scroll"></div>
</div>

</div>

<div class="puntos-container" id="puntosContainer">
<h2 id="puntosTotales"></h2>
<div id="totalAciertos"></div>
</div>

</div>

<script src="calculadora.js"></script>

</body>
</html>
